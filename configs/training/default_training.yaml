training:
  num_epochs: 200
  early_stopping:
    patience: 15
    min_delta: 1e-5
    monitor: "val_loss"
  optuna:
    n_trials: 50
    direction: "minimize"
    learning_rate:
        min: 0.0001
        max: 0.01
        log: true
  
# Scheduler configuration
scheduler:
  name: "ReduceLROnPlateau"  # Options: "ReduceLROnPlateau", "StepLR", "CosineAnnealingLR"
  params:
    patience: 10
    factor: 0.5
    min_lr: 1e-6

# Optimizer configuration  
optimizer:
  name: "AdamW"  # Options: "Adam", "AdamW", "SGD"
  params:
    weight_decay: 0.01

evaluation:
  threshold: 100  # Maximum return threshold
  prediction_limit: 10  # Maximum prediction value
  metrics:
    - "mse"
    - "rmse" 
    - "mae"
    - "r2"
    - "direction_accuracy"
    - "profitable_trades"
    - "information_ratio"
    - "correlation"
    - "market_adjusted_return"
    - "sharpe_ratio"
    - "total_return"
    - "win_rate"
    - "profit_factor"

data:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  use_augmentations: true

# Financial evaluation specific settings
financial:
  trading_strategy:
    position_sizing: "equal_weight"  # Options: "equal_weight", "kelly", "volatility_parity"
    transaction_cost: 0.001  # 0.1% transaction cost
    max_position_size: 0.05  # Maximum 5% position size
  risk_management:
    max_drawdown: 0.20  # Maximum 20% drawdown
    stop_loss: 0.10  # 10% stop loss
    take_profit: 0.15  # 15% take profit
  benchmark:
    risk_free_rate: 0.02  # 2% annual risk-free rate