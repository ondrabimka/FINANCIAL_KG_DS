model:
  name: "HeteroGNN"
  fixed_params:
    out_channels: 1
    dropout: 0.2
  optuna_params:
    hidden_channels:
      min: 64
      max: 512
      log: true
    num_layers:
      min: 2
      max: 6
    gnn_aggr:
      choices: ["add", "mean", "max"]

# News encoder configuration
news_encoder:
  type: "sentiment"  # Options: "sentiment" (FinBERT), "openai" (OpenAI embeddings), "onehot"
  openai_model: "text-embedding-3-small"  # Options: "text-embedding-3-small", "text-embedding-3-large" (only used when type="openai")

loss:
  name: "asymmetric"  # Options: "mse", "asymmetric", "huber", "quantile"
  params:
    alpha: 1.5  # For asymmetric loss - penalize over-predictions more
    beta: 0.9   # For quantile loss
    delta: 1.0  # For huber loss